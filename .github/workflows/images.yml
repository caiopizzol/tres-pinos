name: images

# A tag such as v0.1.0 publishes each connector's image to ghcr.io/caiopizzol/tres-pinos/<connector>:v0.1.0, for amd64
# and arm64, with a provenance attestation. There is no `latest`: compose.yaml names the version it was released with,
# so a checkout pulls the images built from the same code. To release, set that version in compose.yaml, merge, then
# tag the merge commit.
#
# GitHub may create a new package as private, and only its settings page can make it public. After the first
# release, check that each image pulls without signing in; if not, open the package's settings, Danger Zone, Change
# visibility, Public. That can't be undone, and later releases keep it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        connector: [sicoob, inter, nfse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose.yaml names this version
        run: grep -qF "tres-pinos/${{ matrix.connector }}:\${TRES_PINOS_VERSION:-$GITHUB_REF_NAME}" compose.yaml
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: connectors/${{ matrix.connector }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/caiopizzol/tres-pinos/${{ matrix.connector }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/caiopizzol/tres-pinos
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/caiopizzol/tres-pinos/${{ matrix.connector }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Attaches compose.yaml and the example settings to the version's release, so the quick start downloads them from
  # releases/latest without a clone. GitHub renames .env.example to default.env.example, so it goes up as env.example.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .env.example env.example
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" compose.yaml env.example --clobber
          # A draft is never releases/latest, so publish it; GitHub picks latest by version.
          gh release edit "$GITHUB_REF_NAME" --draft=false
