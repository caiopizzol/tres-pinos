name: images

# A tag such as v0.1.0 publishes each connector's image to ghcr.io/caiopizzol/tres-pinos/<connector>, for amd64 and
# arm64, under that version and `latest`, with a provenance attestation. compose.yaml pulls these images.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        connector: [sicoob, inter, nfse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: connectors/${{ matrix.connector }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/caiopizzol/tres-pinos/${{ matrix.connector }}:${{ github.ref_name }}
            ghcr.io/caiopizzol/tres-pinos/${{ matrix.connector }}:latest
          labels: org.opencontainers.image.source=https://github.com/caiopizzol/tres-pinos
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/caiopizzol/tres-pinos/${{ matrix.connector }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
