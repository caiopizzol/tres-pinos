name: kicktires

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  submit:
    name: queue review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue review on the shared workers
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          KICKTIRES_HUB: ${{ vars.KICKTIRES_HUB }}
        with:
          github-token: ${{ secrets.KICKTIRES_DISPATCH_TOKEN }}
          script: |
            const hub = process.env.KICKTIRES_HUB;
            if (!/^[\w.-]+\/[\w.-]+$/.test(hub ?? '')) {
              throw new Error('Set KICKTIRES_HUB to the hub owner/repository');
            }
            const [owner, repo] = hub.split('/');
            const response = await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner, repo, workflow_id: 'review.yml', ref: 'main',
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
              inputs: {
                repository: `${context.repo.owner}/${context.repo.repo}`,
                pr: String(context.payload.pull_request.number),
                head: context.payload.pull_request.head.sha,
              },
            });
            const url = response.data.html_url;
            if (!url) throw new Error('GitHub did not return the queued review URL');
            await core.summary.addLink('Review queued on the shared workers', url).write();
