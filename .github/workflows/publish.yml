name: publish

# Publishes a package to npm when its tag is pushed, such as nfse-v0.1.1 for packages/nfse at version 0.1.1. npm
# trusts this workflow (trusted publishing), so there is no token, and each version links back to the build that
# made it.
on:
  push:
    tags: ["nfse-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # The tag must name the version in package.json, so a tag never publishes something else.
      - name: Check the tag
        run: |
          package="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          test "$(jq -r .version "packages/$package/package.json")" = "$version"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - run: bun run test
        working-directory: packages/${{ env.PACKAGE }}
      - run: npm publish --access public
        working-directory: packages/${{ env.PACKAGE }}
