name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  # The image the README runs, with every media fixture through its converters. Transcription needs a server,
  # so it's checked by hand: see connectors/whatsapp/docs/checks.md.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f connectors/whatsapp/Dockerfile -t whatsapp .
      - run: docker build -f connectors/sicoob/Dockerfile -t sicoob .
      - run: >-
          docker run --rm --entrypoint node
          -v "$PWD/connectors/whatsapp/scripts:/app/connectors/whatsapp/scripts:ro"
          -v "$PWD/connectors/whatsapp/fixtures:/app/connectors/whatsapp/fixtures:ro"
          -v "$PWD/packages/boleto/fixtures:/app/packages/boleto/fixtures:ro"
          whatsapp scripts/media.mjs
