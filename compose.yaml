# Each connector runs only when its profile is in COMPOSE_PROFILES, and checks its own settings. It sees only its own
# certificate and key, so one connector can't read another's; a missing file stops it instead of becoming a directory.
services:
  sicoob:
    build:
      context: .
      dockerfile: connectors/sicoob/Dockerfile
    restart: unless-stopped
    profiles: [sicoob]
    environment:
      SICOOB_KEY: ${SICOOB_KEY:-}
      SICOOB_CLIENT_ID: ${SICOOB_CLIENT_ID:-}
      SICOOB_ACCOUNT: ${SICOOB_ACCOUNT:-}
      SICOOB_CERT_PATH: /certificate/sicoob.crt
      SICOOB_CERT_KEY_PATH: /certificate/sicoob.key
      SICOOB_CERT_PASSWORD: ${SICOOB_CERT_PASSWORD:-}
    ports:
      - 127.0.0.1:3012:8080
    volumes:
      - type: bind
        source: ${SICOOB_CERT_DIR:-./certificate}/sicoob.crt
        target: /certificate/sicoob.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SICOOB_CERT_DIR:-./certificate}/sicoob.key
        target: /certificate/sicoob.key
        read_only: true
        bind:
          create_host_path: false
  inter:
    build:
      context: .
      dockerfile: connectors/inter/Dockerfile
    restart: unless-stopped
    profiles: [inter]
    environment:
      INTER_KEY: ${INTER_KEY:-}
      INTER_CLIENT_ID: ${INTER_CLIENT_ID:-}
      INTER_CLIENT_SECRET: ${INTER_CLIENT_SECRET:-}
      INTER_CERT_PATH: /certificate/inter.crt
      INTER_CERT_KEY_PATH: /certificate/inter.key
      PUBLIC_URL: ${INTER_PUBLIC_URL:-}
    ports:
      - 127.0.0.1:3013:8080
    volumes:
      - type: bind
        source: ${INTER_CERT_DIR:-./certificate}/inter.crt
        target: /certificate/inter.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INTER_CERT_DIR:-./certificate}/inter.key
        target: /certificate/inter.key
        read_only: true
        bind:
          create_host_path: false
      - inter:/data
  nfse:
    build:
      context: .
      dockerfile: connectors/nfse/Dockerfile
    restart: unless-stopped
    profiles: [nfse]
    environment:
      NFSE_KEY: ${NFSE_KEY:-}
      NFSE_CERT_PATH: /certificate/nfse.crt
      NFSE_CERT_KEY_PATH: /certificate/nfse.key
      NFSE_CERT_PASSWORD: ${NFSE_CERT_PASSWORD:-}
      PUBLIC_URL: ${NFSE_PUBLIC_URL:-}
    ports:
      - 127.0.0.1:3014:8080
    volumes:
      - type: bind
        source: ${NFSE_CERT_DIR:-./certificate}/nfse.crt
        target: /certificate/nfse.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NFSE_CERT_DIR:-./certificate}/nfse.key
        target: /certificate/nfse.key
        read_only: true
        bind:
          create_host_path: false
      - nfse:/data

volumes:
  inter:
  nfse:
